name: scenario-orbit-shop

on:
  pull_request:
    paths:
      - content/debugging/orbit-shop/**
      - internal/**
      - cmd/**
      - go.mod
      - go.sum
      - .github/workflows/scenario-orbit-shop.yaml
  push:
    branches: [main]
    paths:
      - content/debugging/orbit-shop/**
      - internal/**
      - cmd/**
      - go.mod
      - go.sum
      - .github/workflows/scenario-orbit-shop.yaml

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install kind and kubectl
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kind /tmp/kubectl
          sudo mv /tmp/kind /tmp/kubectl /usr/local/bin/
      - name: validate
        run: go run ./cmd/interviews validate
      - name: prove
        run: go run ./cmd/interviews prove orbit-shop
