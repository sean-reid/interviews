name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The content staleness tests build their fixture by rewinding a
          # clone of this repository, which needs more than one commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: format
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: validate content
        run: go run ./cmd/interviews validate

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S warning session/host/*.sh

  # The optimization ladder scores real implementations, so it is tested by
  # running them: a tier nobody can reach, or a harness that cannot tell two
  # tiers apart, otherwise only shows up in a candidate's six hours.
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: aligner ladder selftest
        run: content/takehome/aligner-ladder/interviewer/selftest.sh
