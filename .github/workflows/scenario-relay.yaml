name: scenario-relay

on:
  pull_request:
    paths:
      - content/debugging/relay/**
      - internal/**
      - go.*
      - .github/workflows/scenario-relay.yaml
  push:
    branches: [main]
    paths:
      - content/debugging/relay/**
      - internal/**
      - go.*
      - .github/workflows/scenario-relay.yaml

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: validate
        run: go run ./cmd/interviews validate
      - name: prove
        run: go run ./cmd/interviews prove relay
