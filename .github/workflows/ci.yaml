name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The content staleness tests build their fixture by rewinding a
          # clone of this repository, which needs more than one commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: format
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: validate the examples
        run: go run ./cmd/interviews validate --content examples

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S warning session/host/*.sh

  # Nothing else reads infra/. A syntax or type error there merges green and
  # is found by whoever next runs start --remote, which is the slowest and
  # most expensive place to find one. An EC2 action that does not exist has
  # already shipped this way once.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: format
        run: terraform fmt -check -recursive infra
      # The reaper terminates instances on a schedule, so the decision about
      # which ones is the part worth gating. Standard library only, so there
      # is nothing to install.
      - name: reaper
        run: python3 -m unittest discover -s infra/aws/account/reaper -v
      - name: validate
        run: |
          for mod in infra/aws/*/; do
            echo "== $mod"
            # No backend: validate needs no credentials and no state, which is
            # what lets this run on a pull request from anywhere.
            terraform -chdir="$mod" init -backend=false -input=false >/dev/null
            terraform -chdir="$mod" validate
          done

  # shellcheck cannot know whether a package exists on the release the host
  # actually runs, nor whether the script leaves behind what it claims. A
  # container is that release. This runs the whole of provision.sh offline and
  # then checks what it left: both host bugs that reached a real box would have
  # failed here, minutes instead of the quarter hour a provision takes to say
  # so.
  host-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: provision a container as if it were a host
        run: session/host/offline-test.sh

  # The examples are the spec's worked problems, so they have to keep working:
  # a broken one is a wrong spec. Only the debugging toy needs a cluster.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: prove toy-cache
        run: go run ./cmd/interviews prove toy-cache --content examples
      - name: bundle the offline examples
        run: |
          go run ./cmd/interviews bundle toy-dedupe --content examples --seed ci -o /tmp/dedupe
          go run ./cmd/interviews bundle toy-fanout --content examples --seed ci -o /tmp/fanout
