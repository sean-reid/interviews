apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: toy-{{.app_name}}
  annotations:
    example.test/build: "{{.build_id}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: toy-{{.app_name}}
spec:
  selector:
    app: cache
  ports:
    - name: http
      port: 80
      targetPort: http
